name: Ω Autonomous Project Loop

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: autonomous-main
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read durable project state
        run: |
          set -euo pipefail
          for f in INTENT.md SPEC.md STATE.md DECISIONS.md CAPABILITIES.md EVIDENCE.md swarm/autopilot/task-queue.json swarm/autopilot/intent-compiler.py swarm/autopilot/nbag.py swarm/autopilot/continuation.py; do test -s "$f"; done

      - name: Compile intent gaps into tasks
        run: |
          set -euo pipefail
          python3 swarm/autopilot/intent-compiler.py

      - name: Ω NBAG mandatory decision gate
        id: nbag
        run: |
          set -euo pipefail
          python3 swarm/autopilot/nbag.py >/tmp/nbag.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open('swarm/autopilot/next-best-action.json',encoding='utf-8'))
          assert x['gate']=='OMEGA_NBAG'
          assert x['rule']=='NO_VERIFIED_DECISION_NO_EXECUTION'
          selected=x.get('selected_task_id') or ''
          print('active='+('true' if selected else 'false'))
          print('task_id='+selected)
          PY

      - name: Verify decision before execution
        if: steps.nbag.outputs.active == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          x=json.load(open('swarm/autopilot/next-best-action.json',encoding='utf-8'))
          assert x['decision']=='EXECUTE'
          assert x['selected_task_id']=='${{ steps.nbag.outputs.task_id }}'
          assert x['candidate_count'] > 0
          print('NBAG_EXECUTION_AUTHORIZED:', x['selected_task_id'])
          PY

      - name: Cache local model
        if: steps.nbag.outputs.active == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ll-model
          key: ll-qwen25-05b-q4km-v2

      - name: Run real local model agent
        if: steps.nbag.outputs.active == 'true'
        env:
          NBAG_TASK_ID: ${{ steps.nbag.outputs.task_id }}
        run: |
          chmod +x swarm/autopilot/model-runner.sh
          bash swarm/autopilot/model-runner.sh

      - name: Validate autonomous result
        if: steps.nbag.outputs.active == 'true'
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open('swarm/autopilot/last-agent-output.json',encoding='utf-8'))
          required=['task_id','status','next_task','summary','edits','tests','evidence','failure_reason']
          assert all(k in x for k in required)
          assert x['task_id']=='${{ steps.nbag.outputs.task_id }}'
          assert x['status'] in ('completed','blocked','failed')
          assert all(isinstance(e,dict) and 'path' in e and 'content' in e for e in x['edits'])
          d=json.load(open('swarm/autopilot/next-best-action.json',encoding='utf-8'))
          assert d['selected_task_id']==x['task_id']
          print('REAL_AGENT_OUTPUT: VALID; NBAG: ENFORCED')
          PY

      - name: Apply bounded recovery policy
        if: steps.nbag.outputs.active == 'true'
        run: |
          set -euo pipefail
          python3 swarm/autopilot/recovery-policy.py

      - name: Decide autonomous continuation
        id: cont
        run: |
          set -euo pipefail
          python3 swarm/autopilot/continuation.py
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open('swarm/autopilot/continuation.json',encoding='utf-8'))
          assert x['gate']=='OMEGA_CONTINUATION'
          assert x['rule']=='CONTINUE_UNTIL_TERMINAL_OR_SAFE_BLOCKED'
          assert x['decision'] in ('CONTINUE','SAFE_BLOCKED','TERMINAL_CANDIDATE')
          print('decision='+x['decision'])
          PY

      - name: Continuation safety regression
        if: steps.nbag.outputs.active == 'true'
        run: |
          set -euo pipefail
          bash scripts/health-check.sh
          bash tests/test-structure.sh
          bash tests/test-intent-gate.sh
          bash tests/test-nbag.sh
          bash tests/test-continuation.sh
          bash tests/test-adversarial.sh

      - name: Terminal candidate verification
        if: steps.cont.outputs.decision == 'TERMINAL_CANDIDATE'
        run: |
          set -euo pipefail
          bash scripts/health-check.sh
          bash tests/test-structure.sh
          bash scripts/intent-gate.sh
          bash tests/test-intent-gate.sh
          bash tests/test-nbag.sh
          bash tests/test-continuation.sh
          bash tests/test-adversarial.sh
          if [ -x projects/demo-project/scripts/release-gate.sh ]; then
            bash projects/demo-project/scripts/release-gate.sh
          fi

      - name: Write continuation evidence
        run: |
          set -euo pipefail
          mkdir -p ops
          cp swarm/autopilot/continuation.json ops/continuation-state.json
          case '${{ steps.cont.outputs.decision }}' in
            SAFE_BLOCKED)
              printf '# SAFE_BLOCKED\n\nThe autonomous continuation controller found a terminal failure or dependency deadlock. See ops/continuation-state.json and task evidence.\n' > ops/SAFE_BLOCKED.md
              rm -f ops/TERMINAL_CANDIDATE.md
              ;;
            TERMINAL_CANDIDATE)
              printf '# TERMINAL_CANDIDATE\n\nNo pending or failed task remains. Terminal gates must prove the intent before ACHIEVED/RELEASED.\n' > ops/TERMINAL_CANDIDATE.md
              rm -f ops/SAFE_BLOCKED.md
              ;;
            CONTINUE)
              rm -f ops/SAFE_BLOCKED.md ops/TERMINAL_CANDIDATE.md
              ;;
          esac

      - name: Autonomous checkpoint commit
        run: |
          set -euo pipefail
          mkdir -p ops
          test ! -f swarm/autopilot/last-agent-output.json || cp swarm/autopilot/last-agent-output.json ops/autopilot-last-result.json
          test ! -f swarm/autopilot/next-best-action.json || cp swarm/autopilot/next-best-action.json ops/next-best-action.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -E '^\.github/|^\.git/' >/dev/null; then
            echo 'FORBIDDEN_AUTONOMOUS_CHANGE_IN_GOVERNANCE_AREA'; exit 1
          fi
          git diff --cached --quiet || git commit -m "chore: autonomous continuation checkpoint (${{ steps.nbag.outputs.task_id || 'no-task' }})"
          git push

      - name: Dispatch assurance evidence cycle
        if: steps.nbag.outputs.active == 'true' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run assurance.yml --ref main

      - name: Dispatch immediate next autonomous cycle
        if: steps.cont.outputs.decision == 'CONTINUE' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo 'SELF_CHAIN=DISPATCH_NEXT'
          gh workflow run autopilot.yml --ref main

      - name: Safe blocked terminal
        if: steps.cont.outputs.decision == 'SAFE_BLOCKED'
        run: echo 'AUTONOMY=SAFE_BLOCKED; evidence persisted; no automatic next cycle.'

      - name: Terminal candidate reached
        if: steps.cont.outputs.decision == 'TERMINAL_CANDIDATE'
        run: echo 'AUTONOMY=TERMINAL_CANDIDATE; terminal gates passed for this cycle; no invented task.'
