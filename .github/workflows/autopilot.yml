name: Ω Autonomous Project Loop

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  workflow_run:
    workflows: ["Ω Assurance"]
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: autonomous-main
  cancel-in-progress: false

jobs:
  autopilot:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read durable project state
        run: |
          set -euo pipefail
          for f in SPEC.md STATE.md DECISIONS.md CAPABILITIES.md EVIDENCE.md swarm/autopilot/task-queue.json; do test -s "$f"; done

      - name: Detect executable task
        id: task
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          q=json.load(open('swarm/autopilot/task-queue.json',encoding='utf-8'))
          done={t['id'] for t in q['tasks'] if t.get('status')=='completed'}
          active=next((t for t in q['tasks'] if t.get('status')=='pending' and all(d in done for d in t.get('depends_on',[]))),None)
          print('active='+('true' if active else 'false'))
          print('task_id='+(active['id'] if active else ''))
          PY

      - name: Cache local model
        if: steps.task.outputs.active == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ll-model
          key: ll-qwen25-05b-q4km-v1

      - name: Run real local model agent
        if: steps.task.outputs.active == 'true'
        run: |
          chmod +x swarm/autopilot/model-runner.sh
          bash swarm/autopilot/model-runner.sh

      - name: Validate autonomous result
        if: steps.task.outputs.active == 'true'
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open('swarm/autopilot/last-agent-output.json',encoding='utf-8'))
          required=['task_id','status','next_task','summary','edits','tests','evidence','failure_reason']
          assert all(k in x for k in required)
          assert x['task_id']=='${{ steps.task.outputs.task_id }}'
          assert x['status'] in ('completed','blocked','failed')
          assert x['evidence'] or x['status'] != 'completed'
          assert all(isinstance(e,dict) and 'path' in e and 'content' in e for e in x['edits'])
          print('REAL_AGENT_OUTPUT: VALID')
          PY

      - name: Apply bounded recovery policy
        if: steps.task.outputs.active == 'true'
        run: |
          set -euo pipefail
          python3 swarm/autopilot/recovery-policy.py

      - name: Autonomous checkpoint commit
        if: steps.task.outputs.active == 'true'
        run: |
          set -euo pipefail
          mkdir -p ops
          cp swarm/autopilot/last-agent-output.json ops/autopilot-last-result.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -E '^\.github/|^\.git/' >/dev/null; then
            echo 'FORBIDDEN_AUTONOMOUS_CHANGE_IN_GOVERNANCE_AREA'; exit 1
          fi
          git diff --cached --quiet || git commit -m "chore: autonomous agent task checkpoint (${{ steps.task.outputs.task_id }})"
          git push

      - name: Dispatch next assurance cycle
        if: steps.task.outputs.active == 'true' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run assurance.yml --ref main

      - name: Terminal evidence only
        if: steps.task.outputs.active != 'true'
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            echo '# Autonomous Terminal State'
            echo
            echo "UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo 'All currently executable tasks are complete.'
          } > artifacts/autonomous-terminal.md
          echo 'NO_EXECUTABLE_TASK: no main-branch commit is created.'
