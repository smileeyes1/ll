name: Ω Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: assurance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assurance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Root health check
        run: bash scripts/health-check.sh
      - name: Root structure test
        run: bash tests/test-structure.sh
      - name: Ω Autonomous leadership gate test
        run: bash tests/test-leadership.sh
      - name: Intent achievement gate
        run: bash scripts/intent-gate.sh
      - name: Intent gate regression test
        run: bash tests/test-intent-gate.sh
      - name: Intent-to-task compiler test
        run: bash tests/test-intent-compiler.sh
      - name: Ω NBAG decision gate test
        run: bash tests/test-nbag.sh
      - name: Ω Continuation test
        run: bash tests/test-continuation.sh
      - name: Stale snapshot checkpoint test
        run: bash tests/test-stale-checkpoint.sh
      - name: Root adversarial test
        run: bash tests/test-adversarial.sh
      - name: Project Factory v3 leadership smoke test
        run: |
          set -euo pipefail
          test -s scripts/project-factory.sh
          test -s templates/PROJECT/AUTONOMY_CONSTITUTION.md
          test -s templates/PROJECT/INTENT.md
          test -s templates/PROJECT/SPEC.md
          test -s templates/PROJECT/STATE.md
          test -s templates/PROJECT/scripts/release-gate.sh
          PROBE="assurance-factory-probe-${GITHUB_RUN_ID}"
          bash scripts/project-factory.sh "$PROBE" 'Build a verified test outcome'
          cd "projects/$PROBE"
          grep -q 'Build a verified test outcome' INTENT.md
          grep -q 'NO LEADERSHIP DECISION' AUTONOMY_CONSTITUTION.md
          bash tests/test-structure.sh
          bash tests/test-adversarial.sh
          if bash scripts/release-gate.sh >/tmp/factory-premature-gate.log 2>&1; then
            echo 'FAIL: release gate allowed GO without artifact'
            exit 1
          fi
          grep -q 'NO-GO: no non-empty artifact' /tmp/factory-premature-gate.log
          echo 'FACTORY_PRE_ARTIFACT_NO_GO=PASS'
          printf 'verified factory probe artifact\n' > artifacts/factory-product.txt
          bash scripts/release-gate.sh
          echo 'FACTORY_POST_ARTIFACT_GO=PASS'
      - name: Demo project verification
        run: |
          cd projects/demo-project
          bash tests/test-structure.sh
          bash tests/test-adversarial.sh
          bash scripts/release-gate.sh
      - name: Autonomous loop smoke test
        run: |
          chmod +x swarm/autopilot/*.sh
          bash swarm/autopilot/orchestrator.sh
          test -s swarm/autopilot/task-queue.json
          test -s swarm/autopilot/runtime-state.json
      - name: Chaos / disaster drill
        run: |
          chmod +x swarm/autopilot/*.sh
          bash swarm/autopilot/chaos-test.sh
      - name: Regression pass
        run: |
          bash scripts/health-check.sh
          bash tests/test-structure.sh
          bash tests/test-leadership.sh
          bash tests/test-intent-gate.sh
          bash tests/test-intent-compiler.sh
          bash tests/test-nbag.sh
          bash tests/test-continuation.sh
          bash tests/test-stale-checkpoint.sh
          bash tests/test-adversarial.sh
          cd projects/demo-project
          bash tests/test-structure.sh
          bash tests/test-adversarial.sh
          bash scripts/release-gate.sh
      - name: Build assurance report
        run: |
          mkdir -p artifacts
          {
            echo '# Assurance Report'
            echo
            echo "UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Commit: $GITHUB_SHA"
            echo "Ref: $GITHUB_REF"
            echo 'Root Health: PASS'
            echo 'Root Structure: PASS'
            echo 'Autonomous Leadership: PASS'
            echo 'Intent Gate: PASS'
            echo 'Intent Gate Regression: PASS'
            echo 'Intent-to-Task Compiler: PASS'
            echo 'NBAG Decision Gate: PASS'
            echo 'Continuation: PASS'
            echo 'Stale Snapshot Safety: PASS'
            echo 'Root Adversarial: PASS'
            echo 'Factory v3 Leadership Smoke: PASS'
            echo 'Factory Premature Release: BLOCKED AS EXPECTED'
            echo 'Factory Artifact Release: PASS'
            echo 'Demo Project: PASS'
            echo 'Autonomous Loop Smoke: PASS'
            echo 'Chaos / Disaster Drill: PASS'
            echo 'Regression: PASS'
            echo 'Release Gate: PASS'
          } > artifacts/assurance-report.md
      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: assurance-report
          path: artifacts/assurance-report.md
          if-no-files-found: error
          retention-days: 30
