name: Ω Autonomy Supervisor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - 'ops/intents/inbox/**'
      - 'swarm/autopilot/task-queue.json'
      - 'STATE.md'
  workflow_run:
    workflows: ["Ω Autonomous Project Loop", "Ω Assurance"]
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: autonomy-supervisor
  cancel-in-progress: true

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout durable state
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inspect queue and active workflows
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          q=json.load(open('swarm/autopilot/task-queue.json',encoding='utf-8'))
          done={t['id'] for t in q['tasks'] if t.get('status')=='completed'}
          active=next((t for t in q['tasks'] if t.get('status')=='pending' and all(d in done for d in t.get('depends_on',[]))),None)
          print('executable_task='+('true' if active else 'false'))
          print('task_id='+(active['id'] if active else ''))
          r=subprocess.run(['gh','run','list','--workflow','autopilot.yml','--limit','10','--json','status,conclusion,databaseId'],capture_output=True,text=True,check=True)
          runs=json.loads(r.stdout)
          live=any(x.get('status') in ('queued','in_progress') for x in runs)
          print('autopilot_live='+('true' if live else 'false'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('executable='+('true' if active else 'false')+'\n')
              f.write('live='+('true' if live else 'false')+'\n')
          PY

      - name: Dispatch autonomous execution
        if: steps.inspect.outputs.executable == 'true' && steps.inspect.outputs.live != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run autopilot.yml --ref main
          echo 'AUTONOMY_DISPATCHED=true'

      - name: Record supervisor evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts
          printf '%s\n' '# Autonomy Supervisor Check' > artifacts/autonomy-supervisor.md
          printf '%s\n' "UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> artifacts/autonomy-supervisor.md
          printf '%s\n' "Executable task: ${{ steps.inspect.outputs.executable }}" >> artifacts/autonomy-supervisor.md
          printf '%s\n' "Autopilot live: ${{ steps.inspect.outputs.live }}" >> artifacts/autonomy-supervisor.md
          printf '%s\n' 'The supervisor never marks work complete; it only starts/restarts execution when durable state proves work is pending and no execution is active.' >> artifacts/autonomy-supervisor.md
