name: Ω Autonomy Watchdog

on:
  workflow_run:
    workflows: ["Ω Autonomous Project Loop"]
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: autonomy-watchdog
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout durable state
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inspect queue
        id: queue
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          q=json.load(open('swarm/autopilot/task-queue.json',encoding='utf-8'))
          done={t['id'] for t in q['tasks'] if t.get('status')=='completed'}
          active=next((t for t in q['tasks'] if t.get('status')=='pending' and all(d in done for d in t.get('depends_on',[]))),None)
          print('active='+('true' if active else 'false'))
          print('task_id='+(active['id'] if active else ''))
          PY

      - name: Inspect active autopilot runs
        id: active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/actions/workflows/autopilot.yml/runs?per_page=20" > /tmp/runs.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open('/tmp/runs.json',encoding='utf-8'))
          active=any(r.get('status') in ('queued','in_progress','waiting','requested') for r in x.get('workflow_runs',[]))
          print('active='+('true' if active else 'false'))
          PY

      - name: Bounded recovery
        if: steps.queue.outputs.active == 'true' && steps.active.outputs.active != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/actions/workflows/autopilot.yml/runs?per_page=20" > /tmp/runs.json
          python3 - <<'PY'
          import json,datetime
          x=json.load(open('/tmp/runs.json',encoding='utf-8'))
          now=datetime.datetime.now(datetime.timezone.utc)
          recent=[]
          for r in x.get('workflow_runs',[]):
              if r.get('status')!='completed': continue
              ts=r.get('updated_at') or r.get('created_at')
              try: dt=datetime.datetime.fromisoformat(ts.replace('Z','+00:00'))
              except Exception: continue
              if (now-dt).total_seconds() <= 1800 and r.get('conclusion') in ('failure','cancelled','timed_out'):
                  recent.append(r)
          print('recent_autopilot_failures_30m=',len(recent))
          if len(recent) >= 3:
              print('RECOVERY_BUDGET_EXHAUSTED')
              raise SystemExit(20)
          PY
          gh workflow run autopilot.yml --ref main
          echo 'AUTOPILOT_RECOVERY_DISPATCHED'

      - name: Healthy/no-work
        if: steps.queue.outputs.active != 'true' || steps.active.outputs.active == 'true'
        run: echo 'WATCHDOG_NO_ACTION'
